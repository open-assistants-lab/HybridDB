[project]
name = "hybriddb"
version = "0.4.1"
description = "Embedded, local, open-source hybrid search for AI agents — SQLite + FTS5 + ChromaDB with self-healing journal"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["hybrid-search", "vector-search", "keyword-search", "sqlite", "chromadb", "fts5", "embeddings"]
license = {text = "MIT"}
authors = [
    {name = "Eddy Xu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chromadb>=1.5.0,<2.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.0.0,<2.0",
]
graph = [
    "networkx>=3.0,<4.0",
]
all = [
    "hybriddb[analytics,graph]",
]
sentence-transformers = [
    "sentence-transformers>=3.0.0,<6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "duckdb>=1.0.0",
    "networkx>=3.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.3.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hybriddb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "graph: tests for graph features (requires networkx)",
    "analytics: tests for DuckDB analytics (requires duckdb)",
    "benchmark: performance benchmarks skipped unless --run-benchmarks is passed",
]
